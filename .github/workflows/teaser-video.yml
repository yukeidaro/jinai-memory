name: Teaser video

on:
  push:
    branches:
      - video/teaser
    paths:
      - "video/**"
      - ".github/workflows/teaser-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: video
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned video dependencies
        run: npm install --no-audit --no-fund

      - name: Render JinAIMemoryDemo as a 55-second MP4
        run: npm run render:teaser

      - name: Render eight review stills
        run: npm run stills:teaser

      - name: Enforce 1650 frames, 1920x1080 and 30fps
        run: |
          node --input-type=module -e 'import { inspectOutput } from "./render-teaser.mjs"; await inspectOutput();'

      - name: Upload teaser video, stills and media information
        uses: actions/upload-artifact@v4
        with:
          name: jinai-memory-demo-55s-${{ github.run_number }}
          path: |
            video/out/jinai-memory-demo-55s.mp4
            video/out/stills-55s/
            video/out/media-info-55s.json
          retention-days: 7
          if-no-files-found: error
